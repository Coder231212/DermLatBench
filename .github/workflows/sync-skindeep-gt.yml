name: SkinDeep manual GT correction
on:
  push:
    paths:
      - '.github/workflows/sync-skindeep-gt.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Synchronize ground truth (metadata only)
        run: python3 scripts/apply_skindeep_manual_gt_20261120.py
      - name: Verify only expected files changed
        run: |
          git diff --name-only | sort > /tmp/changed.txt
          printf '%s\n' data/dermlatbench_metadata.csv data/skindeep_metadata.csv | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          python3 scripts/verify_no_images.py
      - name: Commit reconciled metadata and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dermlatbench_metadata.csv data/skindeep_metadata.csv docs/SKINDEEP_GT_MANUAL_CORRECTIONS_20261120.md
          git commit -m "Confirm DLB_00012001 and DLB_00012096 as RIGHT in both GT files"
          git push
